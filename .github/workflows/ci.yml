# Stage 11 — CI only.
# GitHub-hosted runners run tests and docker build with no corporate proxy.
# Images stay on the runner. This workflow does not push to a registry
# and does not deploy to the POC or to AWS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: pytest ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-api
          - orders-api
          - incident-detector
          - ai-analyzer
          - remediation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - name: Install and test
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest

  frontend:
    name: frontend test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  helm:
    name: helm lint and RBAC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint, render, and check Roles
        run: |
          helm lint helm/nexops
          helm template nexops helm/nexops --set monitoring.serviceMonitor.enabled=false >/tmp/nexops.yaml
          python -m pip install pytest
          pytest helm/nexops/tests

  images:
    name: docker build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: payment-api
            context: payment-api
            tag: nexops/payment-api:v3
          - name: orders-api
            context: orders-api
            tag: nexops/orders-api:v2
          - name: frontend
            context: frontend
            tag: nexops/frontend:v3
          - name: incident-detector
            context: incident-detector
            tag: nexops/incident-detector:v2
          - name: ai-analyzer
            context: ai-analyzer
            tag: nexops/ai-analyzer:v2
          - name: remediation
            context: remediation
            tag: nexops/remediation:v1
    steps:
      - uses: actions/checkout@v4
      - name: Build image without proxy args
        run: docker build --pull -t ${{ matrix.tag }} ./${{ matrix.context }}
