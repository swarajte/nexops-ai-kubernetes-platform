apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: nexops
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: orders-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: orders-api
    spec:
      containers:
        - name: orders-api
          image: nexops/orders-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: PAYMENT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: nexops-config
                  key: PAYMENT_API_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
