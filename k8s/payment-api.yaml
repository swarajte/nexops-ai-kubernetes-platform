apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: nexops
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: payment-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: payment-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: payment-api
    spec:
      containers:
        - name: payment-api
          image: nexops/payment-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
