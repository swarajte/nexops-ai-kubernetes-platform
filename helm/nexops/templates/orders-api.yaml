apiVersion: v1
kind: ConfigMap
metadata:
  name: nexops-config
  labels:
    app.kubernetes.io/name: nexops
data:
  PAYMENT_API_URL: {{ .Values.ordersApi.paymentApiUrl | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: orders-api
spec:
  replicas: {{ .Values.ordersApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: orders-api
    spec:
      containers:
        - name: orders-api
          image: "{{ .Values.ordersApi.image.repository }}:{{ .Values.ordersApi.image.tag }}"
          imagePullPolicy: {{ .Values.ordersApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ordersApi.service.port }}
          env:
            - name: PAYMENT_API_URL
              valueFrom:
                configMapKeyRef:
                  name: nexops-config
                  key: PAYMENT_API_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ordersApi.resources | nindent 12 }}
