# Store workloads do not call the Kubernetes API. Each gets its own
# ServiceAccount with the API token turned off so they cannot use the
# inherited cluster permissions that exist on this POC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: orders-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-api
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: payment-api
automountServiceAccountToken: false
