apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["payment-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation
subjects:
  - kind: ServiceAccount
    name: remediation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
spec:
  replicas: {{ .Values.remediation.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: remediation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: remediation
    spec:
      serviceAccountName: remediation
      automountServiceAccountToken: true
      {{- include "nexops.podSecurityNonRoot" . | nindent 6 }}
      containers:
        - name: remediation
          image: "{{ .Values.remediation.image.repository }}:{{ .Values.remediation.image.tag }}"
          imagePullPolicy: {{ .Values.remediation.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.remediation.service.port }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: INCIDENT_DETECTOR_URL
              value: {{ .Values.remediation.incidentDetectorUrl | quote }}
            - name: AI_ANALYZER_URL
              value: {{ .Values.remediation.aiAnalyzerUrl | quote }}
            - name: PAYMENT_API_URL
              value: {{ .Values.remediation.paymentApiUrl | quote }}
            - name: KNOWN_GOOD_IMAGE
              value: {{ .Values.remediation.knownGoodImage | quote }}
            - name: ALLOWED_TARGETS
              value: {{ .Values.remediation.allowedTargets | quote }}
            - name: MAX_MEMORY_MI
              value: {{ .Values.remediation.maxMemoryMi | quote }}
            - name: VERIFY_TIMEOUT_SECONDS
              value: {{ .Values.remediation.verifyTimeoutSeconds | quote }}
            - name: VERIFY_POLL_SECONDS
              value: {{ .Values.remediation.verifyPollSeconds | quote }}
            - name: SQLITE_PATH
              value: /data/remediations.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.remediation.resources | nindent 12 }}
          {{- include "nexops.containerSecurity" . | nindent 10 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: remediation
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: remediation
  ports:
    - name: http
      port: {{ .Values.remediation.service.port }}
      targetPort: http
