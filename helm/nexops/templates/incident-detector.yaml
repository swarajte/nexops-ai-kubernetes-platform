apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-detector
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-detector
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-detector
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-detector
subjects:
  - kind: ServiceAccount
    name: incident-detector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-detector
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
spec:
  replicas: {{ .Values.incidentDetector.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: incident-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: incident-detector
    spec:
      serviceAccountName: incident-detector
      automountServiceAccountToken: true
      {{- include "nexops.podSecurityNonRoot" . | nindent 6 }}
      containers:
        - name: incident-detector
          image: "{{ .Values.incidentDetector.image.repository }}:{{ .Values.incidentDetector.image.tag }}"
          imagePullPolicy: {{ .Values.incidentDetector.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.incidentDetector.service.port }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: POLL_SECONDS
              value: {{ .Values.incidentDetector.pollSeconds | quote }}
            - name: SQLITE_PATH
              value: /data/incidents.db
            - name: WATCH_ENABLED
              value: "true"
            - name: PAYMENT_FAIL_STATUS_URL
              value: {{ .Values.incidentDetector.paymentFailStatusUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.incidentDetector.resources | nindent 12 }}
          {{- include "nexops.containerSecurity" . | nindent 10 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: incident-detector
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: incident-detector
  ports:
    - name: http
      port: {{ .Values.incidentDetector.service.port }}
      targetPort: http
