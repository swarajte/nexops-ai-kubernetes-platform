apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-analyzer
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-analyzer
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
rules:
  # Read-only. Analyzer must not patch/delete (Stage 7 + Stage 10).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-analyzer
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-analyzer
subjects:
  - kind: ServiceAccount
    name: ai-analyzer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analyzer
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
spec:
  replicas: {{ .Values.aiAnalyzer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexops
      app.kubernetes.io/component: ai-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexops
        app.kubernetes.io/component: ai-analyzer
    spec:
      serviceAccountName: ai-analyzer
      containers:
        - name: ai-analyzer
          image: "{{ .Values.aiAnalyzer.image.repository }}:{{ .Values.aiAnalyzer.image.tag }}"
          imagePullPolicy: {{ .Values.aiAnalyzer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.aiAnalyzer.service.port }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: INCIDENT_DETECTOR_URL
              value: {{ .Values.aiAnalyzer.incidentDetectorUrl | quote }}
            - name: POLL_SECONDS
              value: {{ .Values.aiAnalyzer.pollSeconds | quote }}
            - name: SQLITE_PATH
              value: /data/analyses.db
            - name: WATCH_ENABLED
              value: "true"
            - name: LLM_URL
              value: {{ .Values.aiAnalyzer.llm.url | quote }}
            - name: LLM_MODEL
              value: {{ .Values.aiAnalyzer.llm.model | quote }}
            {{- if .Values.aiAnalyzer.llm.apiKeySecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aiAnalyzer.llm.apiKeySecret }}
                  key: {{ .Values.aiAnalyzer.llm.apiKeyKey | default "api-key" }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.aiAnalyzer.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analyzer
  labels:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexops
    app.kubernetes.io/component: ai-analyzer
  ports:
    - name: http
      port: {{ .Values.aiAnalyzer.service.port }}
      targetPort: http
