frontend:
  replicaCount: 1
  image:
    repository: nexops/frontend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

ordersApi:
  replicaCount: 1
  image:
    repository: nexops/orders-api
    tag: v2
    pullPolicy: IfNotPresent
  service:
    port: 8001
  paymentApiUrl: http://payment-api:8000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

paymentApi:
  replicaCount: 1
  image:
    repository: nexops/payment-api
    tag: v3
    pullPolicy: IfNotPresent
  service:
    port: 8000
  failureMode: none
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    releaseLabel: prometheus
  grafana:
    dashboard:
      enabled: true
    lokiDatasource:
      enabled: true
      url: http://nexops-loki.nexops-monitoring.svc.cluster.local:3100

incidentDetector:
  replicaCount: 1
  image:
    repository: nexops/incident-detector
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8080
  pollSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
