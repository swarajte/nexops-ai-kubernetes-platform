frontend:
  replicaCount: 1
  image:
    repository: nexops/frontend
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

ordersApi:
  replicaCount: 1
  image:
    repository: nexops/orders-api
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8001
  paymentApiUrl: http://payment-api:8000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

paymentApi:
  replicaCount: 1
  image:
    repository: nexops/payment-api
    tag: v2
    pullPolicy: IfNotPresent
  service:
    port: 8000
  failureMode: none
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
